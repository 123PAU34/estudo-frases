html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "DM Sans",system-ui,sans-serif}

.sub{color:var(--mut);font-size:14px;margin:4px 0 0}

input{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit}
input:focus,button:focus-visible,.card:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
button:hover{background:var(--card2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--h);border-radius:12px;padding:16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:128px}

.card b{font:600 17px/1.25 Fraunces,Georgia,serif}
.card span{color:var(--mut);font-size:14px;margin-top:auto}
.bar{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.bar h2{font:700 24px/1.2 Fraunces,Georgia,serif;margin:0;flex:1}
.list{display:flex;flex-direction:column;gap:8px}
.it{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px;overflow-wrap:anywhere}
.it.sub2{background:none;border:0;font:600 18px Fraunces,Georgia,serif;color:var(--ac);padding:14px 2px 2px}
.tag{display:inline-block;font-size:12px;color:var(--mut);margin-bottom:3px}
mark{background:var(--mark);color:#1a1a1a;border-radius:3px;padding:0 2px}
.cz{color:var(--ac);font-weight:600}
.more{margin:16px auto 0;display:block}
.empty{color:var(--mut);padding:30px 0;text-align:center}
@media (prefers-reduced-motion:no-preference){.card{transition:background .15s}}

ad them}}. Ela queimou as cartas para que o marido nunca as lesse.","He worked hard in order that {{c1::he would pass}} all his exams. Ele trabalhou duro para que ele fosse aprovado em todas as provas.","I wish that {{c1::you'd be quiet}} for a minute. Eu gostaria que você ficasse quieto por um minuto. \"Tanto \"\"you'd be quiet\"\" quanto \"\"you would be quiet\"\" estão corretos.\"","{{c1::I wish he'd call me}} more often. Eu gostaria que ele me ligasse com mais frequência.","My car {{c1::wouldn't start this morning}}. Meu carro não ligava hoje de manhã.","When my friend still lived here, {{c1::we would eat lunch together}} every day. Quando meus amigos ainda moravam aqui, nós almoçávamos juntos todos os dias.","When my parents were away, {{c1::my grandmother would take care of me}}. Quando meus pais estavam fora, minha avó cuidava de mim.","{{c1::He'd always be the first}} to offer to help. Ele sempre era o primeiro a oferecer ajuda. \"Tanto \"\"He'd always be the first\"\" quanto \"\"He would always be the first\"\" estão corretos.\"","- Where did they go? - {{c1::How would I know?}} - Onde eles foram? - Como que eu vou saber?","{{c1::I'd rather}} stand. \"Eu prefiro ficar de pé. (sem usar a palavra \"\"prefer\"\")\" \"Tanto \"\"I'd rather\"\" quanto \"\"I would rather\"\" estão corretos.\"","{{c1::I'd rather}} study English than German. \"Eu prefiro estudar inglês do que alemão. (sem usar a palavra \"\"prefer\"\")\" \"Tanto \"\"I'd rather\"\" quanto \"\"I would rather\"\" estão corretos.\"","{{c1::I'd rather}} not go. \"Eu prefiro não ir. (sem usar a palavra \"\"prefer\"\")\"","{{c1::They'd rather}} do things themselves. \"Eles preferem fazer as coisas por conta própria. (sem usar a palavra \"\"prefer\"\")\"","{{c1::You'd better tell her}} everything. É melhor você contar para ela tudo.","{{c1::I'd better get back}} to work. É melhor eu voltar para o trabalho.","{{c1::We'd better meet}} early. É melhor nós nos encontrarmos cedo.","{{c1::You may be}} right. \"(u eat the answer? \"(usando \"\"may\"\") Se eu pudesse/Se fosse possível, você poderia repetir a resposta?\"","I'd like to ask a question, {{c1::if I may}}. \"(usando \"\"may\"\") Eu gostaria de fazer uma pergunta, se for possível/se eu pudesse.\"","What a very attractive dress, {{c1::if I may say so}}. \"(usando \"\"may\"\") Que vestido atrativo, se me permite dizer/se eu posso dizer isso.\"","We exercise {{c1::so that we may be}} strong and healthy. \"(usando \"\"may\"\") Nós fazemos exercícios para que possamos ser fortes e saudáveis.\"","I work hard so that my family {{c1::may not go hungry}}. \"(usando \"\"may\"\") Eu trabalho duro para que minha família não passe fome.\"","There has been some improvement in the economy in recent months, but, {{c1::be that as it may}}, many people are still looking for work. \"(usando \"\"may\"\") Houve alguma melhora na economia nos últimos meses, mas, ainda assim/seja como for, muitas pessoas ainda estão procurando trabalho.\"","If no one else wants it, {{c1::we may as well}} give it to him. \"(usando \"\"may\"\") Se ninguém mais quer (isso), nós podemos muito bem dar (isso) para ele.\"","If you are going to have sugar, {{c1::you may as well}} have a bar of chocolate. \"(usando \"\"may\"\") Se você vai comer açúcar, você pode muito bem comer uma barra de chocolate.\"","{{c1::There may be}} exceptions. Pode haver exceções.","{{c1::There may be}} another chance. Pode haver outra chance.","{{c1::There may be}} trouble ahead. Pode haver problemas pela frente.","{{c1::It might be}} true. \"(usando \"\"might\"\") Pode ser verdade.\"","The test {{c1::might include some questions}} about geography. \"(usando \"\"might\"\") O teste pode incluir algumas questões sobre geografia.\"","I thought {{c1::you might like}} this. \"(usando \"\"might\"\") Pensei que você talvez gostasse disso.\"","If we hurry, {{c1::we might get there}} before it rains. \"(usando \"\"might\"\") Se nos apressarmos, nós talvez cheguemos lá antes de chover.\"","I thought {{c1::we might go to the zoo}} on Saturday. \"(usando \"\"might\"\") Pensei que talvez pudéssemos ir ao zoológico no sábado.\"","{{c1::He might be slow}}, but he does very good work. \"(usando \"\"might\"\") Ele pode ser lento, mas faz um ótimo trabalho.\"","{{c1::It might be cold outside}}, but it's still a beautiful day. \"(usando \"\"might\"\") Pode estar frio lá fora, mas ainda assim está um dia lindo.\"","{{c1::She might have been}} a great actress, but she was a terrible parent. \"(usando \"\"might\"\") Ela pode ter sido uma grande atriz, mas foi uma mãe terrível.\"","{{c1::Might I use}} your phone? \"(usando \"\"might\"\") Eu poderia usar o seu telefone?\"","{{c1::Might I ask}} who is calling? \"(usando \"\"might\"\") Eu poderia perguntar quem está chamando?\"","{{c1::It might be wise}} to proceed cautiously. \"(usando \"\"might\"\") Seria sábio/prudente proceder cautelosamente.\"","{{c1::You might at least}} apologize! \"(usando \"\"might\"\") Você poderia pelo menos se desculpar!\"","Honestly, {{c1::you might have told me}}! \"(usando \"\"might\"\") Honestamente, você poderia ter me contado!\"","I think {{c1::you might at least}} offer to help! \"(usando \"\"might\"\") Eu acho que você poderia pelo menos se oferecer para ajudar!\"","- I have a request to make. - {{c1::And what might that be}}? \"(usando \"\"might\"\") - Eu tenho um pedido a fazer. - E o que seria?\"","And {{c1::who might you be}}? \"(usando \"\"might\"\") E quem seria você?\"","{{c1::Might I just say}} how pleased I am to be here. \"(usando \"\"might\"\") Eu gostaria de dizer como eu estou satisfeito de estar aqui.\"","If you are going to have sugar, {{c1::you might as well}} have a bar of chocolate. \"(usando \"\"might\"\") Se você vai comer açúcar, você pode muito bem comer uma barra de chocolate.\""]},{"n":"Carros e Acessórios Automotivos","i":"🚗","l":["C2.01.049 optimal (adj) /ˈɒptɪməl/ to the maximum or best possible extent The car reaches its optimal fuel efficiency at an average \"; use \"\"bouncing around\"\") As crianças estavam pulando pelo cômodo.\" The children were bouncing around the room.","\"(Use \"\"went out a couple of\"\") Eles saíram juntos um par de vezes.\" They went out a couple of times.","\"(Use \"\"arguing\"\") Meus irmãos estão sempre discutindo.\" My brothers are always arguing.","\"(Use \"\"surprisingly articulate\"\") A criança era surpreendentemente articulada.\" The child was surprisingly articulate.","\"(Use \"\"brainy kid\"\") Ele é uma criança inteligente.\" He is a brainy kid.","\"(Use \"\"kids\"\"; use \"\"catch on quickly\"\") As crianças vão entender rapidamente.\" The kids will catch on quickly.","\"(European folklore; use \"\"punishes misbehaving\"\") O Krampus pune crianças malcriadas.\" Krampus punishes misbehaving children.","\"(European folklore; use \"\"A changeling was believed to be\"\"; use \"\"faerie child\"\") Acreditava-se que uma criança trocada era uma fada criança.\" A changeling was believed to be a faerie child.","\"(Use \"\"clans\"\"; use \"\"chieftains\"\") Os clãs eram comandados por chefes.\" The clans were commanded by chieftains.","\"(Use \"\"kids\"\"; use \"\"family room\"\") As crianças estão na sala de estar.\" The kids are in the family room.","A arte ajuda as crianças a expressarem suas emoções. Art helps children express their emotions.","\"(Use \"\"ensemble cast\"\") \"\"Friends\"\" é um exemplo de um elenco de protagonistas.\" \"\"\"Friends\"\" is an example of an ensemble cast.\"","\"(Simple past; use \"\"woollen garments\"\") Ela fez roupas de lã para as crianças.\" She made woollen garments for the children.","\"(Use \"\"to covet your neighbor's wife\"\") É um pecado cobiçar a mulher do próximo.\" It is a sin to covet your neighbor's wife.","\"(Use \"\"devoted herself to\"\") Ela se dedicou à família.\" She devoted herself to her family.","\"(Use \"\"devoted\"\") Ele era um marido dedicado.\" He was a devoted husband.","Minha irmã estuda neurociência. My sister studies neuroscience.","\"(Use \"\"lumberjack\"\") Meu avô era lenhador.\" My grandfather was a lumberjack.","Os pais dela respeitaram sua decisão. Her parents respected her decision.","\"(Use \"\"a Founding Father\"\") George Washington foi um dos fundadores dos Estados Unidos.\" George Washington was a Founding Father.","\"(Use \"\"Genealogy\"\"; use \"\"family history\"\") A genealogia é o estudo da história familiar.\" Genealogy is the study of family history.","\"(Use \"\"a historian\"\") Minha irmã é historiadora.\" My sister is a historian.","\"(Use \"\"is the same height as\"\") Ela tem a mesma altura da irmã.\" She is the same height as her sister.","As crianças estão no jardim. The children are in the garden.","\"(Simple past; use \"\"hall\"\"; use \"\"wedding reception\"\") Nós alugamos um salão para a recepção de casamento.\" We rented a hall for the wedding reception.","\"(Use \"\"Bruxism\"\") O bruxismo é comum em crianças.\" Bruxism is common in children.","\"(Use \"\"Cataracts\"\") Cataratas podem também afetar bebês.\" Cataracts can also affect babies.","\"(Use \"\"cerebral palsy\"\") Meu irmão tem paralisia cerebral.\" My brother has cerebral palsy.","Minha filha ama mangas. My daughter loves mangoes.","\"(Use \"\"a luthier\"\") Meu pai é luteiro.\" My father is a luthier.","\"(Use \"\"has moved in with\"\") Paula foi morar com o namorado.\" Paula has moved in with her boyfriend.","\"(Use \"\"babbled happily\"\") O bebê balbuciou alegremente.\" The baby babbled happily.","\"(Use \"\"bawling\"\") Uma criança estava berrando.\" A child was bawling.","\"(Use \"\"bickering\"\") As crianças estão sempre se desentendendo.\" The children are always bickering.","\"(Use \"\"blubbering like\"\") Ele estava chorando alto como um bebê.\" He was blubbering like a baby.","\"(Use \"\"To put it bluntly\"\") Para falar francamente, eu quero o divórcio.\" To put it bluntly, I want a divorce.","\"(Use \"\"boasting about\"\") Ela está se gabando de seus filhos.\" She is boasting about her children.","Eu a considero uma amiga. I consider her a friend.","\"(Use \"\"pansies\"\") Minha mãe adora amores-perfeitos.\" My mother loves pansies.","\"(Use \"\"psychologist\"\") A mãe dela é psicóloga.\" Her mother is a psychologist.","\"(Use \"\"rancher\"\") Meu tio é fazendeiro.\" My uncle is a rancher.","\"(Use \"\"real estate agent\"\") Minha irmã é corretora de imóveis.\" My sister is a real estate agent.","\"(Use \"\"sailor\"\") Meu avô era marinheiro.\" My grandfather was a sailor.","\"(Use \"\"a shipwright\"\") Meu avô era construtor naval.\" My grandfather was a shipwright.","\"(Use \"\"a silversmith\"\") Meu bisavô era prateiro.\" My great-grandfather was a silversmith.","\"(Use \"\"an undertaker\"\") Meu tio era agente funerário.\" My uncle was an undertaker.","\"(Use \"\"a veterinarian\"\") Minha namorada é veterinária.\" My girlfriend is a veterinarian.","\"(Use \"\"a Web developer\"\") Meu irmão é desenvolvedor Web.\" My brother is a Web developer.","\"(Use \"\"wedding gown\"\") É o meu vestido de noiva.\" It is my wedding gown."]},{"n":"Educação e Escola","i":"🎓","l":["C2.01.003 interaction (n) /ˌɪntərˈækʃn/ the act of communicating with or reacting to others Teachers are under pressure to create positive interactions between local children and immigrant students. interactions ➣ interact (v), interactive (adj), interactively (adv) pages 6-7 Reading 1 Do You Mind?","C2.01.033 inhibit (v) /ɪnˈhɪbɪt/ restrict sb’s actions by causing them to feel shy or embarrassed Students felt that their new teacher inhibited them from learning with her strict manner. inhibited ➣ inhibition (n) pages 6-7 Reading 1 Do You Mind?","C2.01.037 introductory (adj) /ˌɪntrəˈdʌktəri/ intended to introduce you to a subject or activity The college offers a range of short introductory courses for foreign students. introductory ➣ introduce (v), introduction (n) pages 6-7 Reading 1 Do You Mind?","C2.01.040 temperament (n) /ˈtemprəmənt/ your manner of behaving or reacting towards others Lucy’s calm temperament makes her an ideal school counsellor. temperament ➣ temperamental (adj), temperamentally (adv) pages 6-7 Reading 1 Do You Mind?","C2.01.041 track (v) /træk/ follow the progress of sth/sb Our tutor gives us monthly tests to track our academic progress. track ➣ tracker (n) pages 6-7 Reading 1 Do You Mind?","C2.01.052 empathetic (adj) /ˌemˌpəˈθetˌɪk/ showing understanding for sb’s feelings Good teachers have to be both patient and empathetic towards their students’ needs. empathetic ➣ empathise (v), empathy (n), empathetically (adv) pages 6-7 Reading 1 Do You Mind?","C2.01.054 adolescent (n) /ˌædəˈlesnt/ a teenager; sb going through the stage of life between childhood and adulthood Ms Jones refused to take her class on a three-day excursion as she did not wish to be held responsible for a group of adolescents. adolescents ➣ adolescence (n), adolescent (adj) pages 6-7 Reading 1 Do You Mind?","C2.01.056 peer (n) /pɪə(r)/ sb of the same age or in the same social position as another Sophie gets along well with most of her peers in her class at college. peers pages 6-7 Reading 1 Do You Mind?","C2.01.059 infer (v) /ɪnˈfɜː(r)/ make an educated guess or develop an opinion about sth based on the information given From the author’s overall tone, we can infer that she must have had a difficult childhood. infer ➣ inference (n) pages 6-7 Reading 1 Do You Mind?","C2.01.068 misspent (adj) /ˌmɪsˈspent/ used in a careless or wasteful way Despite her misspent teenage years when she hardly studied at all, Elaine passed her university degree with flying colours. misspent ➣ misspend (v) pages 8-9-10 Vocabulary 1 Do You Mind?","C2.01.074 aberrant (adj) /æˈberənt/ antisocial Mike was expelled from school as a result of his repeated aberrant behaviour in class. aberrant ➣ aberration (n) pages 8-9-10 Vocabulary 1 Do You Mind?","C2.01.088 withdrawn (adj) /wɪðˈdrɔːn/ quiet and introverted; not outgoing Mabel had become even more shy and withdrawn as she found it hard to fit in at her new school. withdrawn ➣ withdraw (v) pages 8-9-10 Vocabulary 1 Do You Mind?","C2.01.094 impassive (adj) /ɪmˈpæsɪv/ showing no sign of emotion From her impassive expression, you can never tell what our teacher is thinking. impassive ➣ impassively (adv) pages 8-9-10 Vocabulary 1 Do You Mind?","C2.01.126 drift apart (phr v) /drɪft əˈpɑːt/ gradually become less friendly with sb We were best friends at school, but we drifted apart over the years when we went off to study at different universities. drifted apart ➣ drift (n), drifter (n) pages 8-9-10 Vocabulary 1 Do You Mind?","C2.01.134 urge (v) /ɜːdʒ/ encourage or strongly advise sb to do sth Jeff wanted to study art, but his parents were urging him to leave school and get a job to earn a living. urging ➣ urge (n), urging (n), urgent (adj) pages 8-9-10 Vocabulary 1 Do You Mind?","C2.01.155 be on good terms (expr) /bi ɒn ɡʊd tɜːmz/ have a friendly relationship Jerry is an amicable student who is on good terms with most of his teachers. on good terms pages 8-9-10 Vocabulary 1 Do You Mind?","C2.01.169 clique (n) /kliːk/ a small close-knit group which excludes others I’m afraid the school students’ committee has become a bit of a clique who are doing whatever they feel like whilst ignoring their classmates’ views. clique ➣ cliquey (adj) pages 8-9-10 Vocabulary 1 Do You Mind?","C2.01.178 prone (to) (adj) /prəʊn (tə)/ likely to do sth or suffer sth Our old teacher was prone to falling asleep in the middle of a exam. prone pages 8-9-10 Vocabulary 1 Do You Mind?","C2.01.195 innate (adj) /ɪˈneɪt/ that you were born with Do you believe that musical talent is innate or is it learned? innate ➣ innately (adv) pages 16-17 Writing 1 Do You Mind?","C2.01.209 boundary (n) /ˈbaʊndri/ a point that marks the limit of sth Teachers have to set boundaries for student behaviour within the classroom environment. boundaries pages 16-17 Writing 1 Do You Mind?","\"Não há exemplos com os quais aprender. ( \"\"Não há nenhum ::I must confess}}, I haven't read the book yet. \"(usando \"\"must\"\") Eu preciso confessar, eu ainda não li o livro.\" I must confess, I haven't read the book yet.","This book is a {{c1::must-read}}. Esse livro é uma leitura obrigatória. This book is a must-read.","\"(usando \"\"there had been...\"\") Ele ouviu que tinha acontecido um acidente e correu até a \"\"cena/local\"\".\" He heard there had been an accident and rushed to the scene.","Ele deu o livro para mim. He gave the book to me.","O seu livro é novo. Your book is new.","O livro é seu. The book is yours.","\"(usando \"\"I've...\"\") Eu trouxe este livro para lhe mostrar.\" I've brought this book to show you.","Estes livros são dela. These books are hers.","\"(usando \"\"all of...\"\") Todas as pessoas estavam cantando.\" All of the people were singing.","As pessoas estavam todas cantando. The people were all singing.","Pegue qualquer livro que você goste. \"Take any book you like. (\"\"Tale any book that you like\"\" também está correto)\"","Algum destes livros pertence a você? Do any of these books belong to you?","\"(Use \"\"cookery book\"\") Este é meu livro de receitas favorito.\" This is my favorite cookery book.","\"(Use \"\"I'd like to book\"\") Eu gostaria de reservar quartos adjacentes.\" I'd like to book adjoining rooms.","\"(Use \"\"I'd like to book\"\") Eu gostaria de reservar quartos conectados.\" I'd like to book connecting rooms.","\"(Use \"\"fully booked\"\") Desculpe; estamos lotados.\" I'm sorry; we're fully booked.","\"(Use \"\"I'd like to book\"\") Eu gostaria de reservar um quarto duplo.\" I'd like to book a double room.","(Simple past) Eu estava absorta em meu livro. I was absorbed in my book.","\"(Use \"\"annoy\"\") As piadas dele me irritam.\" His jokes annoy me.","Nós assistimos beisebol na TV ontem à noite. We watched baseball on TV last night.","Ele é um boxeador famoso. He is a famous boxer.","Ele é um ator famoso. He is a famous actor.","\"(Use \"\"TV broadcaster\"\") Ele e h Wednesday.","Amanhã é o batismo dele. Tomorrow is his baptism.","O bar mitzvah dele é amanhã. His bar mitzvah is tomorrow.","\"(Use \"\"weeks long\"\") O ano acadêmico tem 32 semanas.\" The academic year is 32 weeks long.","O esperanto foi criado no século XIX. Esperanto was created in the 19th century.","\"(Simple past; use \"\"dozed off\"\") Eu cochilei por dez minutos.\" I dozed off for ten minutes.","Você está ocupado esta noite? Are you busy tonight?","\"(Simple past; use \"\"it\"\") Isso melhorou minha rotina diária.\" It improved my daily routine.","\"(Use \"\"fifth century AD\"\") Foi construído no século V d.C.\" It was built in the fifth century AD.","John trabalha em domingos alternados. John works on alternate Sundays.","A reunião anual é em julho. The annual meeting is in July.","Anna nasceu em abril. Anna was born in April.","\"(Use \"\"BCE\"\") Foi construído no terceiro século AEC.\" It was built in the third century BCE.","Amanhã é o grande dia. Tomorrow is the big day.","\"(Use \"\"Knead the dough\"\") Sove a massa por cinco minutos.\" Knead the dough for 5 minutes.","\"(Use \"\"a weekend getaway\"\") É apenas uma pequena viagem de fim de semana.\" It is just a weekend getaway.","Vocês têm vaga para esta noite? Do you have a vacancy for tonight?","\"(Use \"\"racquetball\"\") Eles jogam raquetebol uma vez por semana.\" They play racquetball once a week.","Nós visitamos o Capitólio ontem. We visited the Capitol yesterday.","\"(Use \"\"My stepbrother\"\") O filho do meu padrasto/da minha madrasta tem dez anos de idade.\" My stepbrother is ten years old.","\"(Use \"\"Dew\"\"; use \"\"usually\"\") O orvalho é normalmente formado à noite.\" Dew is usually formed at night.","\"(Use \"\"a dull, drizzly\"\") Era uma manhã nublada de garoa.\" It was a dull, drizzly morning.","\"(Use \"\"equinoxes\"\") Há dois equinócios no ano.\" There are two equinoxes in the year.","\"(Use \"\"christening\"\") O batismo dele é no próximo domingo.\" His christening is next Sunday.","\"(Use \"\"Dead Week\"\"; use \"\"Iowa State\"\") Nós levamos a semana antes das provas a sério na Universidade Estadual de Iowa.\" We take Dead Week seriously at Iowa State.","\"(Use \"\"essay\"\"; use \"\"is due\"\") A redação é para amanhã.\" The essay is due tomorrow.","\"(Use \"\"hope to join\"\"; use \"\"fraternity\"\") Eu espero entrar para uma fraternidade ano que vem.\" I hope to join a fraternity next year.","\"(Use \"\"Cork\"\"; use \"\"extracted\"\") A cortiça é extraída de maio a agosto.\" Cork is extracted from May to August.","\"(Use \"\"Try to establish\"\") Tente estabelecer uma rotina.\" Try to establish a routine.","\"(Use \"\"The US\"\"; use \"\"the Gregorian calendar\"\") Os EUA seguem o calendário gregoriano.\" The US follows the Gregorian calendar.","\"(Use \"\"the 21st century\"\") Este é o século XXI da Era Comum.\" This is the 21st century of the Common Era.","\"(Use \"\"will'; use \"\"its centenary\"\") O clube vai celebrar seu centenário no ano que vem.\" The club will celebrate its centenary next year.","\"(Use \"\"in the 18th century\"\") Foi construído no século XVIII.\" It was built in the 18th century.","\"(Use \"\"Daylight Saving Time\"\") O Horário de Verão começa em março.\" Daylight Saving Time starts in March.","\"(Use \"\"The nineties\"\"; use \"\"rapid advances\"\") Os anos noventa foram uma década de avanços rápidos.\" The nineties were a decade of rapid advances.","\"(Use \"\"My essay is due\"\") Minha redação deve ser entregue na próxima sexta-feira.\" My essay is due next Friday.","\"(Use \"\"was bedridden\"\") Ela ficou de cama por muitos anos.\" She was bedridden for many years.","\"(Use \"\"Set the timer\"\") Ajuste o temporizador para cinco minutos.\" Set the timer for 5 minutes.","\"(Use \"\"toaster\"\") Eu uso minha torradeira todas as manhãs.\" I use my toaster every morning.","\"(Use \"\"For all I care\"\"; use \"\"can leave\"\") Por mim, ele pode ir embora hoje.\" For all I care, he can leave today.","  come for us to leave.","\"(Use \"\"in my hour of need\"\") Ela me ajudou no momento de necessidade.\" She helped me in my hour of need.","\"(Use \"\"picked up a bug\"\") Eu peguei uma virose no fim de semana passado.\" I picked up a bug last weekend.","\"(Use \"\"go punting\"\") Você quer ir andar de punt amanhã?\" Do you want to go punting tomorrow?","\"(Simple past; use \"\"got caught in\"\"; use \"\"morning rush hour\"\") Nós ficamos presos na hora do rush da manhã.\" We got caught in the morning rush hour.","\"(Use \"\"We've been on the road\"\") Nós estamos na estrada desde terça-feira.\" We've been on the road since Tuesday.","Eles se mudaram para Helsinque no ano passado. They moved to Helsinki last year.","\"(Use \"\"the 1950s\"\") Jukeboxes eram populares durante a década de 1950.\" Jukeboxes were popular during the 1950s.","Aquele bar tem karaokê no sábado à noite. That bar has karaoke on Saturday night.","\"(Use \"\"in any time signature\"\") Marchas podem ser escritas em qualquer tempo.\" Marches can be written in any time signature.","\"(Use contractions; use \"\"jaunt\"\") É apenas um passeio de fim de semana.\" It's just a weekend jaunt.","\"(Use \"\"go jogging\"\"; use \"\"evening\"\") Eu corro todas as noites.\" I go jogging every evening.","\"(Use \"\"marched in the parade\"\") Centenas de pessoas marcharam na parada.\" Hundreds of people marched in the parade.","\"(Use \"\"bantered\"\") Nós trocamos gracejos por alguns minutos.\" We bantered for a few minutes.","\"(Use \"\"Smog levels\"\") Os níveis de nevoeiro contaminado por fumaça estão altos hoje.\" Smog levels are high today.","\"(Use \"\"polar night\"\") A noite polar pode durar meses.\" The polar night can last months.","\"(Use \"\"a high annual rainfall\"\") A área tem uma alta precipitação anual.\" The area has a high annual rainfall.","\"(Use \"\"first-year resident\"\") Ela é residente do primeiro ano em oncologia.\" She is a first-year resident in oncology.","\"(Use \"\"Pastels colors are in\"\") As cores pastel estão em alta este ano.\" Pastels colors are in this year."]},{"n":"Frases Gerais e Gramática (sem tema específico)","i":"📝","l":["C2.01.013 compact (v) /kəmˈpækt/ compress the parts of sth closely together into a more solid state or into a smaller space After the household waste is collected, it is compacted into large blocks to take up less space. compacted ➣ compact (n), compact (adj) pages 6-7 Reading 1 Do You Mind?","C2.01.015 subsequent (adj) /ˈsʌbsɪkwənt/ coming after sth else The cause of the accident was unknown until the subsequent enquiry was conducted. subsequent ➣ subsequently (adv) pages 6-7 Reading 1 Do You Mind?","C2.01.019 against all odds (expr) /əˈɡenst ɔːl ɒdz/ despite seeming impossible Against all odds, the climbing team made it to the top of K2. Against all odds pages 6-7 Reading 1 Do You Mind?","C2.01.046 mosaic (n) /məʊˈzeɪɪk/ a pattern or image made with many small parts put together The path leading to the mansion was a mosaic of broken tiles and pebbles. mosaic ➣ mosaic (adj) pages 6-7 Reading 1 Do You Mind?","C2.01.050 attribute (n) /ˈætrɪbjuːt/ a quality or characteristic Modesty is one of Malcolm’s greatest attributes as he’s rather quiet about his own successes. attributes ➣ attribute (v), attributable (adj) pages 6-7 Reading 1 Do You Mind?","C2.01.065 encompass (v) /ɪnˈkʌmpəs/ include Make sure your essay encompasses all the relevant points. encompasses pages 6-7 Reading 1 Do You Mind?","C2.01.197 susceptible (adj) /səˈseptəbl/ likely to be affected by sth/sb or suffer from sth As a teenager, Mike was highly susceptible to criticism from his peers and took it all very personally. susceptible ➣ susceptibility (n) pages 16-17 Writing 1 Do You Mind?","\"(usando \"\"must\"\") Você tem que vir nos visitar logo.\" You must come visit us soon.","\"(usando \"\"must\"\")Você precisa seguir as regras.\" You must follow the rules.","\"(usando \"\"must not\"\") Você não deve fazer isso.\" You must not do it.","\"(usando \"\"mustn't\"\") Você não deve dizer coisas como essa.\" You mustn't say things like that.","\"(usando \"\"There...\"\") Deve haver algum erro.\" There must be some mistake.","{{c1::I must warn you}}, this will not be easy. \"(usando \"\"must\"\") Eu preciso te avisar, isso não será fácil.\" I must warn you, this will not be easy.","\"(usando \"\"shall not\"\") Eu não vou mencionar isso novamente.\" I shall not mention it again.","\"(usando \"\"shan't\"\") Não vou mencionar isso novamente.\" I shan't mention it again.","Perhaps it will happen. {{c1::We shall see}}. \"Talvez isso acontecerá. Nós vamos ver. (usando \"\"shall\"\")\" Perhaps it will happen. We shall see.","\"(usando \"\"shall\"\") Você deve sair imediatamente!\" \"You shall leave at once! (\"\"You shall leave immediately\"\" também é correto)\"","\"(usando \"\"shall not\"\") Eles não devem passar.\" They shall not pass.","\"(usando \"\"There shall be...\"\") Não é permitido falar durante a prova.\" There shall be no talking during the test.","\"(usando \"\"ought\"\" e \"\"get\"\") Você deveria descansar um pouco.\" You ought to get some rest.","\"(usando \"\"ought\"\") Nós devemos ir agora.\" We ought to go now.","\"(usando \"\"ought\"\") Você deveria saber.\" You ought to know.","\"(usando \"\"ought\"\") Eles deveriam estar aqui agora.\" They ought to be here by now.","Há/Tem duas pessoas esperando lá fora. There are two people waiting outside.","Há muitas razões para fazer isto. There are many reasons to do this.","Há coisas mais importantes a fazer. There are more important things to do.","Há/Existem muitas oportunidades. There are plenty of opportunities.","\"(usar \"\"anything\"\") Não há nada novo.\" There isn't anything new.","Não há muito para comemorar. There isn't much to celebrate.","Não há palavras que descrevem (isso). There aren't words that describe it.","Não há tantas regras assim. There aren't that many rules.","Tem alguma coisa que eu posso fazer por você? \"Is there anything I can do for you? (\"\"that I can do...\"\" também está certo)\"","Existe vida depois da morte? Is there life after death?","\"(usando \"\"anybody\"\") Tem alguém lá fora?\" Is there anybody out there?","Existem quaisquer exceções? Are there any exceptions?","Existem efeitos colaterais? Are there side effects?","Há outras opções de suporte? Are there other support options?","Houve um problema. There was a problem.","Houve uma oportunidade histórica. There was a historic opportunity.","Havia muitas coisas a fazer. There were many things to do.","\"(usar \"\"a lot of...\"\") Tinha muitas pessoas.\" There were a lot of people.","Existiam gigantes naqueles dias. There were giants in those days.","Houve coisas que nós não fizemos bem. \"There were things that we didn't do well. (\"\"that\"\" aqui é opcional, a frase fica certa com ou sem \"\"that\"\")\"","\"(usando \"\"anything\"\") Não tinha nada de novo.\" There wasn't anything new.","Não havia muito o que comemorar. There wasn't much to celebrate.","Não havia uma única pessoa. There wasn't a single person.","Não havia palavras que descrevessem (isso). There weren't words that describe it.","Não havia tantas regras assim. There weren't that many rules.","Tinha uma maneira melhor? Was there a better way?","Tinha muitas coisas para fazer? Were there many things to do?","Houve algum sobrevivente? Were there any survivors?","\"(usando \"\"There's been...\"\") Houve uma modesta redução.\" There's been a modest reduction.","\"(usando \"\"There's been...\"\") Ocorreu um erro ao processar a sua solicitação.\" There's been an error processing your request.","\"(usando \"\"There have been...\"\") Houve muitas perguntas.\" \"There have been a lot of questions. (\"\"many questions\"\" também é correto)\"","\"(usando \"\"There have been...\"\") Houve grandes mudanças estruturais.\" There have been large structural changes.","\"(usando \"\"there had been...\"\") Eu gostaria/desejaria que tivesse tido outra maneira.\" I wish there had been another way.","\"(usando \"\"there had been...\"\") Se não tivesse tido intervenção.\" If there had been no intervention.","Haverá consequências. There will be consequences.","\"(usando \"\"no\"\") Não haverá intervalo.\" There will be no intermission.","Haverá uma calamidade. There will be a calamity.","Não haverá nada mais... acabou. There won't be anything else... it's over.","Não haverá uma segunda chance. There won't be a second chance.","Não haverá capacidade suficiente. There won't be enough capacity.","\"(usando \"\"...might...\"\") Pode haver uma maneira mais rápida e mais barata.\" There might be a faster and cheaper way.","\"(usando \"\"...may...\"\") Pode haver problemas/confusão pela frente.\" There may be trouble ahead.","\"(usando \"\"...may...\"\") Pode haver alguns efeitos colaterais.\" There may be some side effects.","\"(usando \"\"...may...\"\") Pode haver um motivo para isso.\" There may be a reason why.","Nós estamos aqui. We are here.","John me conhece. John knows me.","Amanda gosta de você. Amanda likes you.","David abraçou ela. David hugged her.","Luke ajudou eles. Luke helped them.","É importante para você. It's important to you.","Olhe para ela! Look at her!","Ela trabalha para eles. She works for them.","Sou eu. It is me.","É você. It is you.","Foi ele. It was him.","Foi ela. It was her.","Ela é tão alta quanto eu. She is as tall as me.","Ele é mais alto do que ela. He is taller than her.","Eu não consegui mais guardar o segredo (para mim mesmo). I could no longer keep the secret to myself.","Você precisa se sentir bem consigo mesmo. You need to feel good about yourself.","Ela me contou ela mesma que ela estaria aqui. She told me herself that she would be here.","A história continua se repetindo. History keeps repeating itself.","Nós saímos da água e nos secamos. We got out of the water and dried ourselves.","Nós queremos ver por conta própria. We want to see it for ourselves.","Pessoas que são incapazes de cuidar de si mesmas. People w (Use \"\"stevedore\"\") Ele era estivador.\" He was a stevedore.","\"(Use \"\"a telemarketer make\"\") Quanto ganha um operador de telemarketing?\" How much does a telemarketer make?","\"(Use \"\"an upholsterer\"\") Ela é estofadora.\" She is an upholsterer.","\"(Use \"\"see a urologist\"\") Você deveria consultar um urologista.\" You should see a urologist.","\"(Use \"\"as a waitress\"\") Ela trabalha como garçonete.\" She works as a waitress.","\"(Use \"\"decided advantage\"\") Ela tinha uma vantagem incontestável.\" She had a decided advantage.","\"(Use \"\"decidedly careful\"\") Ele foi decididamente cuidadoso.\" He was decidedly careful.","\"(Use \"\"Decolonization\"\") A descolonização foi gradual para algumas colônias.\" Decolonization was gradual for some colonies.","\"(Use \"\"claimed\"\") Ele alegou que o editorial o havia difamado.\" He claimed the editorial had defamed him.","\"(Use \"\"made by default\"\") A decisão deles foi tomada por falta de opção.\" Their decision was made by default.","\"(Use \"\"a defeatist\"\") Ele é um derrotista.\" He is a defeatist.","\"(Use \"\"deflect attention\"\") Eles estão tentando desviar a atenção.\" They are trying to deflect attention.","\"(Use \"\"Minor tasks\"\"; use \"\"delegated\"\") Tarefas menores deveriam ser delegadas.\" Minor tasks should be delegated.","\"(Use \"\"deliberate\"\") Eu acho que foi proposital.\" I think it was deliberate.","\"(Use \"\"deliberately tricked\"\") Ele os enganou deliberadamente.\" He deliberately tricked them.","\"(Use \"\"a demagogue\"\") Ele é um demagogo.\" He is a demagogue.","\"(Use \"\"didn't hesitate to\"\"; use \"\"demagogy\"\") Ele não hesitou em usar demagogia.\" He didn't hesitate to use demagogy.","\"(Use \"\"demand\"\") A demanda deles foi ignorada.\" Their demand was ignored.","\"(Use \"\"détente\"\") Foi um período de trégua.\" It was a period of détente.","\"(Use \"\"helmet\"\") Onde está seu capacete?\" Where is your helmet?","\"(Use \"\"style icon\"\") Ela é um ícone de estilo.\" She is a style icon.","\"(Use \"\"trying hard\"\") Ele está se esforçando para proteger sua imagem.\" He is trying hard to protect his image.","Ela é uma designer imaginativa. She is an imaginative designer.","\"(Use \"\"so inelegant\"\") Foi tão deselegante.\" It was so inelegant.","\"(Use \"\"Jackals\"\") Chacais são onívoros.\" Jackals are omnivorous.","\"(Use \"\"Jays mate\"\") Gaios formam casais para toda a vida.\" Jays mate for life.","\"(Use \"\"Jellyfish\"\"; use \"\"all over the world\"\") As águas-vivas são encontradas em todo o mundo.\" Jellyfish are found all over the world.","\"(Use \"\"small crustaceans\"\") Krill são pequenos crustáceos.\" Krill are small crustaceans.","\"(Use \"\"ladybugs\"\") A maioria das joaninhas tem corpos ovais.\" Most ladybugs have oval bodies.","\"(Use \"\"Larvae\"\") As larvas aparecem em uma variedade de formas.\" Larvae appear in a variety of forms.","\"(Use \"\"lemming\"\") Um lemingue é um pequeno roedor.\" A lemming is a small rodent.","\"(Use \"\"Lemurs\"\") Lêmures são primatas.\" Lemurs are primates.","\"(Use contraction; use \"\"Lionesses\"\"; use \"\"manes\"\") As leoas não têm jubas.\" Lionesses don't have manes.","\"(Use \"\"lynx\"\") O lince é geralmente solitário.\" The lynx is usually solitary.","\"(Use \"\"Manatees\"\") Peixes-bois são herbívoros.\" Manatees are herbivores.","\"(Use \"\"Marmots\"\"; use \"\"large\"\") As marmotas são grandes roedores.\" Marmots are large rodents.","\"(Use \"\"Opossums\"\") Gambás são marsupiais.\" Opossums are marsupials.","\"(Use \"\"Mayflies\"\"; use \"\"several\"\") Efeméridas são consumidos em várias culturas.\" Mayflies are consumed in several cultures.","\"(Use \"\"Meerkats\"\") Os suricatos são ativos durante o dia.\" Meerkats are active during the day.","\"(Use \"\"Mites\"\"; use \"\"arachnids\"\") Ácaros são pequenos aracnídeos.\" Mites are small arachnids.","\"(Use \"\"moose\"\"; use \"\"browsing herbivore\"\") O alce americano é um herbívoro podador.\" The moose is a browsing herbivore.","\"(Use \"\"Moths\"\"; use \"\"greatly\"\") As mariposas variam muito em tamanho.\" Moths vary greatly in size.","\"(Use \"\"claustrophobia\"\") Ela tem claustrofobia.\" She has claustrophobia.","\"(Use \"\"Crowds\"\"; use \"\"claustrophobic\"\") Multidões me deixam claustrofóbico.\" Crowds make me claustrophobic.","\"(Use \"\"Clubfoot\"\"; use \"\"twice as common\"\") O pé torto é duas vezes mais comum em meninos.\" Clubfoot is twice as common in boys.","\"(Use \"\"colic\"\") A causa da cólica é desconhecida.\" The cause of colic is unknown.","\"(Use \"\"colon\"\"; use \"\"digestive system\"\") O cólon é a última parte do sistema digestivo.\" The colon is the last part of the digestive system.","\"(Use \"\"colon polyps\"\"; use \"\"harmless\"\") A maioria dos pólipos no cólon são inofensivos.\" Most colon polyps are harmless.","\"(Use \"\"colonoscopy\"\") Quais são os riscos de uma colonoscopia?\" What are the risks of a colonoscopy?","\"(Use \"\"Color blindness\"\") O daltonismo afeta muitas pessoas.\" Color blindness affects many people.","\"(Use \"\"Colostomies may\"\") As colostomias podem ser temporárias ou permanentes.\" Colostomies may be temporary or permanent.","\"(Use \"\"Comorbidities\"\"; use \"\"coexisting conditions\"\") Comorbidades são condições coexistentes.\" Comorbidities are coexisting conditions.","\"(Use \"\"complications\"\") Ela desenvolveu complicações.\" She developed complications.","\"(Use \"\"Falls\"\"; use \"\"concussion\"\") As quedas são a causa mais comum de concussão.\" Falls are the most common cause of concussion.","\"(Use \"\"stable\"\") A condição dele está agora estável.\" His condition is now stable.","\"(Use \"\"has deteriorated\"\") A condição dela piorou.\" Her condition has deteriorated.","\"(Use \"\"out-of-date condoms\"\") Não use preservativos vencidos.\" Do not use out-of-date condoms."]}];
const $=s=>document.querySelector(s),app=$('#app'),q=$('#q'),PAGE=150;
let cur=null,lim=PAGE;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const clean=s=>s.replace(/""/g,'"').replace(/^"(.*)"$/,'$1');
function fmt(s,re){let h=esc(clean(s)).replace(/\{\{c1::(.*?)\}\}/g,'<span class="cz">$1</span>');
 if(re)h=h.replace(re,m=>'<mark>'+m+'</mark>');return h}
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function rx(t){const e=t.trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return e?new RegExp(e,'gi'):null}
function home(){
 const t=q.value.trim();
 if(t){return results(t)}
 app.innerHTML='<div class="grid">'+D.map((g,i)=>`<button class="card" style="--h:hsl(${i*47%360} 65% 62%)" data-i="${i}"><i class="ic" style="font-style:normal">${g.i}</i><b>${esc(g.n)}</b><span>${g.l.filter(x=>x[0]!='#').length.toLocaleString('pt-BR')} frases</span></button>`).join('')+'</div>';
}
function results(t){
 const n=norm(t),r=rx(t),out=[];
 D.forEach((g,i)=>g.l.forEach(l=>{if(l[0]!='#'&&norm(l).includes(n))out.push([i,l])}));
 const shown=out.slice(0,lim);
 app.innerHTML=`<div class="bar"><h2>${out.length.toLocaleString('pt-BR')} resultados</h2></div><div class="list">`+
  (shown.map(([i,l])=>`<div class="it"><div class="tag">${D[i].i} ${esc(D[i].n)}</div><div>${fmt(l,r)}</div></div>`).join('')||'<div class="empty">Nada encontrado. Tente outra palavra.</div>')+'</div>'+
  (out.length>lim?'<button class="more" id="mo">Mostrar mais</button>':'');
}
function theme(i){
 const g=D[i],t=q.value.trim(),n=norm(t),r=rx(t);
 const L=g.l.filter(l=>!t||(l[0]!='#'&&norm(l).includes(n)));
 const shown=L.slice(0,lim);
 app.innerHTML=`<div class="bar"><button id="bk">← Temas</button><h2>${g.i} ${esc(g.n)}</h2></div><p class="sub">${L.filter(x=>x[0]!='#').length.toLocaleString('pt-BR')} frases</p><div class="list">`+
  (shown.map(l=>l[0]=='#'?`<div class="it sub2">${esc(l.slice(1))}</div>`:`<div class="it">${fmt(l,r)}</div>`).join('')||'<div class="empty">Nada encontrado neste tema.</div>')+'</div>'+
  (L.length>lim?'<button class="more" id="mo">Mostrar mais</button>':'');
}
function render(){cur===null?home():theme(cur)}
function route(){const m=/^#t(\d+)$/.exec(location.hash);cur=m&&D[+m[1]]?+m[1]:null;lim=PAGE;render();window.scrollTo(0,0)}
app.addEventListener('click',e=>{
 const c=e.target.closest('.card');if(c){location.hash='t'+c.dataset.i;return}
 if(e.target.closest('#bk')){q.value='';location.hash='';return}
 if(e.target.closest('#mo')){lim+=PAGE;render()}
});
q.addEventListener('input',()=>{lim=PAGE;render()});
$('#home').onclick=()=>{q.value='';location.hash='';cur=null;lim=PAGE;render()};
window.addEventListener('hashchange',route);
function setTheme(t){document.documentElement.dataset.theme=t;$('#tg').textContent=t=='dark'?'☀ Modo claro':'☾ Modo escuro';try{localStorage.setItem('tema',t)}catch(e){}}
$('#tg').onclick=()=>setTheme(document.documentElement.dataset.theme=='dark'?'light':'dark');
let t0='dark';try{t0=localStorage.getItem('tema')||'dark'}catch(e){}
setTheme(t0);
$('#info').textContent=D.reduce((a,g)=>a+g.l.filter(x=>x[0]!='#').length,0).toLocaleString('pt-BR')+' frases em '+D.length+' temas';
route();
</script>
</body>
</html>
